name: CLI uninstall restoration tests

on:
  pull_request:
    paths:
      - 'Install-AgyProxyPatch.ps1'
      - 'tests/**'
      - '.github/workflows/cli-uninstall-tests.yml'
  workflow_dispatch:

jobs:
  windows-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run PowerShell uninstall smoke tests
        shell: powershell
        run: |
          .\tests\Test-UninstallRestore.ps1
          .\tests\Test-UpdaterSuppression.ps1
